 let end=out;if(pan&&c.createStereoPanner){const p=c.createStereoPanner();p.pan.value=cl(pan,-1,1);out.connect(p);end=p}

 const n=c.createBufferSource();n.buffer=x.nb;const lo=c.createBiquadFilter();lo.type='lowpass';lo.frequency.setValueAtTime(s.f*lp,t);lo.frequency.exponentialRampToValueAtTime(350,t+s.d);

const SPR=[{b:.0016,k:.0009,m:.0105,mv:.016},{b:.0028,k:.0004,m:.0085,mv:.007},{b:.0002,k:0,m:0,mv:.035,ns:.055},{b:.0030,k:.0005,m:.0095,mv:.008},{b:.0015,k:.0009,m:.0095,mv:.015}];

const prevRender=R.render;

})();

<script>
/* ===== PARTE 6 — FÍSICA DO MOVIMENTO DA ARMA (medida no vídeo de referência) =====
   Medi o vídeo: ao andar, a arma balança de lado a ~1,5 vezes por segundo (±4% da tela) e
   sobe/desce ao dobro dessa frequência (±2%), em forma de "8", com leve inclinação.
   Ao correr (analógico quase no máximo) a arma gira para cima e sai pela direita da tela.
   Este bloco:
   - troca o balanço antigo por esse movimento, ligado à velocidade real;
   - cria a CORRIDA (analógico ≥ 90%, sem mirar/atirar/recarregar): +40% de velocidade e arma levantada;
   - balanço da câmera sincronizado com os passos;
   - respiração leve da arma parada.
   Se der erro, se desliga sozinho e o balanço antigo volta. */
(function(){
'use strict';
let SW=null,IN=null,dead=false;
try{
if(typeof THREE==='undefined'||typeof R==='undefined'||typeof WG==='undefined'||typeof C==='undefined'||typeof P==='undefined'||typeof S==='undefined')return;
const cl=(v,a,b)=>Math.max(a,Math.min(b,v));
const P0=new THREE.Vector3(.12,-.34,-.35);                 /* ponto de giro (perto das mãos) */
SW=new THREE.Group();IN=new THREE.Group();
SW.rotation.order='YXZ';
SW.position.copy(P0);IN.position.copy(P0).negate();
C.remove(WG);C.add(SW);SW.add(IN);IN.add(WG);
window.PHYSV=1;window.SPRK=1;window.CBY=undefined;

let mv=0,s=0,ph=0,ad=0,run=false,lt=performance.now(),tt=0;
function neutral(){SW.position.copy(P0);SW.rotation.set(0,0,0);window.CBY=undefined;window.SPRK=1}
function step(){
 const now=performance.now();let dt=(now-lt)/1000;lt=now;if(!(dt>0)||dt>.1)dt=.016;dt=Math.min(dt,.05);tt+=dt;
 if(!started||P.hp<=0){mv=s=0;run=false;neutral();return}
 const mag=Math.min(1,Math.hypot(jx||0,jy||0));
 mv+=(mag-mv)*cl(dt*7,0,1);
 ad+=((sc?1:0)-ad)*cl(dt*12,0,1);
 /* corrida: liga com o analógico ≥ 90%, desliga abaixo de 60% ou ao mirar/atirar/recarregar */
 const busy=sc||firing||rl>0;
 if(!busy&&mag>.9)run=true;else if(busy||mag<.6)run=false;
 s+=((run?1:0)-s)*cl(dt*(run?9:13),0,1);
 /* fase dos passos (sobe com a velocidade) */
 if(mv>.03)ph+=dt*6.2832*1.5*(.55+.45*mv)*(1+.5*s);
 const x=Math.sin(ph),y2=Math.cos(2*ph);

 let ox=x*.024*wk,oy=y2*.011*wk,rz=x*.028*wk,rx=y2*.012*wk,ry=-x*.015*wk;
 /* correndo: arma levantada e jogada para a direita + balanço maior */
 ox+=.19*s+x*.03*sp;oy+=-.15*s+y2*.02*sp;const oz=.03*s;
 rx+=.82*s+y2*.05*sp;ry+=.38*s;rz+=-.30*s+x*.09*sp;
 /* respiração da arma parada */
 const br=1-ad*.8;oy+=Math.sin(tt*1.7)*.0025*br;rz+=Math.sin(tt*1.1)*.004*br;rx+=Math.sin(tt*1.3+1)*.003*br;
 SW.position.set(P0.x+ox,P0.y+oy,P0.z+oz);SW.rotation.set(rx,ry,rz);
 /* câmera: sobe e desce a cada passo; corrida balança mais */
 window.CBY=.017*Math.cos(2*ph-.3)*mv*(1+.5*s)*(1-ad*.7);

}
function off(e){if(dead)return;dead=true;try{console.error('[fisica-arma]',e)}catch(_){}
 try{window.PHYSV=0;window.SPRK=1;window.CBY=undefined;SW.rotation.set(0,0,0);SW.position.copy(P0)}catch(_){}}
const prev=R.render;
R.render=function(sc_,cam){if(!dead&&sc_===S&&cam===C){try{step()}catch(e){off(e)}}return prev.apply(R,arguments)};
console.log('[fisica-arma] ok');
}catch(e){try{console.error('[fisica-arma]',e);window.PHYSV=0;window.SPRK=1;window.CBY=undefined;if(SW&&WG){C.remove(SW);C.add(WG)}}catch(_){}}
})();

 for(let i=0;i<900;i++){g.fillStyle='rgba('+(120+rr(0,40)|0)+','+(80+rr(0,30)|0)+','+(55+rr(0,25)|0)+','+rr(.12,.4)+')';g.fillRect(rr(0,w),rr(0,h),1,rr(2,6))}  /* pelos */
 for(let k=0;k<3;k++){g.strokeStyle='rgba(95,110,150,.22)';g.lineWidth=2.2;g.beginPath();let x=rr(10,w-10);g.moveTo(x,0);for(let y=0;y<=h;y+=16){x+=rr(-5,5);g.lineTo(x,y)}g.stroke()} /* veias */
 for(let i=0;i<500;i++){g.fillStyle='rgba(255,230,200,'+rr(.04,.12)+')';g.fillRect(rr(0,w),rr(0,h),2,2)}});
const TSLV=tex(128,128,(g,w,h)=>{g.fillStyle='#b9b9b9';g.fillRect(0,0,w,h);
 for(let y=0;y<h;y+=3){g.fillStyle='rgba(0,0,0,.22)';g.fillRect(0,y,w,1)}
 for(let x=0;x<w;x+=3){g.fillStyle='rgba(0,0,0,.16)';g.fillRect(x,0,1,h)}
 for(let i=0;i<200;i++){g.strokeStyle='rgba(0,0,0,'+rr(.05,.16)+')';g.lineWidth=rr(1,2.5);g.beginPath();const x=rr(0,w),y=rr(0,h);g.moveTo(x,y);g.lineTo(x+rr(-22,22),y+rr(-8,8));g.stroke()}   /* dobras */
 for(let i=0;i<300;i++){const v=(150+rr(0,90))|0;g.fillStyle='rgba('+v+','+v+','+v+','+rr(.1,.3)+')';g.fillRect(rr(0,w),rr(0,h),1.5,1.5)}});
const MSKIN=new THREE.MeshStandardMaterial({color:0xffffff,map:TSKIN,roughness:.72,metalness:0,envMapIntensity:.25});
const MSLV=new THREE.MeshStandardMaterial({color:0x2c3128,map:TSLV,bumpMap:TSLV,bumpScale:.8,roughness:.92,metalness:0,envMapIntensity:.15,side:THREE.DoubleSide});
const MBAND=new THREE.MeshStandardMaterial({color:0x151617,roughness:.55,metalness:.1,envMapIntensity:.4});
const MCASE=new THREE.MeshStandardMaterial({color:0x2a2c2e,roughness:.35,metalness:.85,envMapIntensity:.9});
const MBEZ=new THREE.MeshStandardMaterial({color:0xb7d335,roughness:.45,metalness:.3,envMapIntensity:.5});
const MDIAL=new THREE.MeshStandardMaterial({color:0x07090a,roughness:.25,metalness:.2,emissive:0x1a2a05,emissiveIntensity:.6});
const MLIT=new THREE.MeshBasicMaterial({color:0xc8ff40});

/* ---------- geometria: tudo em metros a partir da mão (u=0) e depois normalizado (parent escala Y por LEN) ---------- */
function lathe(pts,seg){
 const g=new THREE.LatheGeometry(pts.map(p=>new V2(p[1],p[0]-HALF)),seg||18);   /* [u,r] -> (raio, y) */
 g.scale(1,1/LEN,1);g.computeVertexNormals();return g}
const SKIN_PTS=[[0,.030],[.03,.034],[.07,.037],[.11,.038],[.16,.042],[.21,.049],[.26,.055],[.31,.058],[.355,.056]];
const SLV_PTS=[[.322,.060],[.338,.066],[.358,.074],[.384,.077],[.408,.071],[.424,.066],[.46,.067],[.51,.070],[.55,.072]];
const UP_PTS=[[0,.058],[.1,.066],[.22,.076],[.36,.085],[.47,.082],[.55,.074]];
const GSKIN=lathe(SKIN_PTS,18),GSLV=lathe(SLV_PTS,18),GUP=lathe(UP_PTS,16);

function part(geo,mat,x,u,z,par){const m=new THREE.Mesh(geo,mat);m.position.set(x,(u-HALF)/LEN,z);m.frustumCulled=false;if(par)par.add(m);return m}
const sc1=g=>{g.scale(1,1/LEN,1);return g};

/* ---------- relógio de pulso (braço esquerdo) ---------- */
const _v=new V3(),_m=new M4();
function mkWatch(fore){
 const wg=new THREE.Group();wg.position.set(0,(.165-HALF)/LEN,0);fore.add(wg);
 const hook=[];
 const add=(geo,mat,x,y,z,rx)=>{const m=new THREE.Mesh(geo,mat);if(rx)m.rotation.x=rx;m.position.set(x,y/LEN,z);m.frustumCulled=false;wg.add(m);hook.push(m);return m};
 /* pulseira em volta do pulso */
 add(sc1(new THREE.CylinderGeometry(.0455,.0455,.030,18,1,true)),MBAND,0,0,0).material=new THREE.MeshStandardMaterial({color:0x151617,roughness:.55,metalness:.1,side:THREE.DoubleSide});
 add(sc1(new THREE.CylinderGeometry(.0462,.0462,.007,18,1,true)),MBEZ,0,.0115,0).material=new THREE.MeshStandardMaterial({color:0xb7d335,roughness:.5,side:THREE.DoubleSide});
 /* caixa: eixo Z (face aponta para fora do pulso) */
 const cz=.058;
 add(sc1(new THREE.CylinderGeometry(.027,.029,.014,24).rotateX(Math.PI/2)),MCASE,0,0,cz);
 add(sc1(new THREE.TorusGeometry(.0265,.0042,8,24)),MBEZ,0,0,cz+.0075);
 add(sc1(new THREE.CylinderGeometry(.0225,.0225,.003,24).rotateX(Math.PI/2)),MDIAL,0,0,cz+.0085);
 add(sc1(new THREE.BoxGeometry(.003,.016,.0012)),MLIT,0,.004,cz+.0102);
 add(sc1(new THREE.BoxGeometry(.011,.003,.0012)),MLIT,.003,0,cz+.0102);
 add(sc1(new THREE.BoxGeometry(.006,.006,.002)),MCASE,.033,.006,cz-.006);       /* coroa */
 /* gira o relógio em volta do antebraço para a face ficar virada para cima/câmera */
 const fix=()=>{try{
  _v.set(-.2,1,.32).transformDirection(C.matrixWorld);
  _m.copy(fore.matrixWorld).invert();_v.transformDirection(_m);
  const th=Math.atan2(_v.x,_v.z);
  wg.rotation.y=th;wg.updateMatrixWorld(true)}catch(e){}};
 hook.forEach(m=>{m.onBeforeRender=fix})}

/* ---------- troca os braços de todas as armas ---------- */
let nA=0;
WD.forEach(w=>{const r=w.rig;if(!r)return;
 [[r.R,'R'],[r.L,'L']].forEach(a=>{const arm=a[0];if(!arm||!arm.fore||!arm.upper||arm.fore.userData.a23)return;
  const f=arm.fore,u=arm.upper;
  if(f.geometry)f.geometry.dispose();f.geometry=GSKIN;f.material=MSKIN;f.frustumCulled=false;f.userData.a23=1;
  const sl=new THREE.Mesh(GSLV,MSLV);sl.frustumCulled=false;f.add(sl);
  if(u.geometry)u.geometry.dispose();u.geometry=GUP;u.material=MSLV;u.frustumCulled=false;
  if(a[1]==='L')mkWatch(f);
  nA++})});

/* ---------- mão direita: indicador esticado no guarda-mato ---------- */
let nH=0;
WD.forEach(w=>{const r=w.rig;if(!r||!r.R||!r.R.hand)return;
 const h=r.R.hand;const fing=h.children.filter(o=>o.isGroup&&o.children.some(c=>c.isGroup));
 /* o 1º grupo de dedo (menor x em módulo no lado do polegar) é o indicador */
 const ind=fing.slice().sort((a,b)=>Math.abs(b.position.x)-Math.abs(a.position.x))[0];
 if(!ind)return;
 const ext=[.12,.16,.08];let j=ind.children.find(c=>c.isGroup),i=0;
 while(j&&i<3){j.rotation.x=-ext[i];j=j.children.find(c=>c.isGroup);i++}
 nH++});

/* ---------- pose de quadril: arma mais alta/perto para as mãos aparecerem ---------- */
const IN=WG.parent;
if(IN){
 const HP=new THREE.Group();IN.remove(WG);IN.add(HP);HP.add(WG);
 let ad=0,lt=performance.now();
 const OFF=new V3(-.03,.07,.03);
 const pr=R.render;
 R.render=function(s,c){
  if(s!==undefined&&c===C){try{
   const now=performance.now();let dt=(now-lt)/1000;lt=now;if(!(dt>0)||dt>.1)dt=.016;
   const target=(typeof sc!=='undefined'&&sc)?1:0;ad+=(target-ad)*cl(dt*12,0,1);
   const k=1-ad;HP.position.set(OFF.x*k,OFF.y*k,OFF.z*k)}catch(e){}}
  return pr.apply(R,arguments)}}
console.log('[bracos23] ok: braços',nA,'mãos',nH);
}catch(e){try{console.error('[bracos23]',e)}catch(_){}}
})();
</script>
<script>

(function(){
'use strict';
try{

const KEY='a5v5cfg2';
const fogOK=!!(S.fog&&S.fog.far!==undefined);
const ORIG={near:fogOK?S.fog.near:0,far:fogOK?S.fog.far:0,cfar:C.far};
const DEF={ratio:+R.getPixelRatio().toFixed(2),shadow:dl.castShadow?(dl.shadow.mapSize.x||1024):0,fogFar:ORIG.far,bright:0,fps:0,fpsLimit:0,
 sensT:1,sensA:1,sensG:1,sensV:1,inv:0,stick:1,
 chOn:1,chCol:'#ffffff',chSize:14,fov:75,bo:1,bs:1,hudScore:1,hudMsg:1,autoRl:0,vib:0,vol:100,wake:0,autoRes:1,colorFx:1,shEvery:2,cull:1,scar:1,scx:0,scy:0,scz:0,scs:1,scyw:0,scpt:0,scrl:0,scor:1,qx:0,qy:0,qz:0,qs:1,qyw:0,qpt:0,qrl:0,uzi:1,ux:0,uy:0,uz:0,us:1,uyw:0,upt:0,url:0,m4:1,mx:0,my:0,mz:0,ms:1,myw:0,mpt:0,mrl:0};

try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s)Object.keys(DEF).forEach(k=>{if(s[k]!==undefined)cfg[k]=s[k]})}catch(e){}

let paused=0;

/* ---------- estilo ---------- */
const st=document.createElement('style');

#cfg p{opacity:.8;line-height:1.4;margin:8px 0}
#fpsb{position:fixed;left:50%;top:34px;transform:translateX(-50%);font:700 12px monospace;color:#7dff9a;background:#0008;padding:2px 8px;border-radius:6px;pointer-events:none;display:none;z-index:3}
#brk,#brl{position:fixed;inset:0;pointer-events:none}
`;
document.head.appendChild(st);

/* ---------- brilho (duas camadas, ficam atrás do HUD) ---------- */
const brk=document.createElement('div');brk.id='brk';brk.style.background='#000';brk.style.opacity=0;
const brl=document.createElement('div');brl.id='brl';brl.style.background='#fff';brl.style.mixBlendMode='soft-light';brl.style.opacity=0;
R.domElement.after(brk,brl);
const fpsb=document.createElement('div');fpsb.id='fpsb';document.body.appendChild(fpsb);

/* ---------- aplicar ajustes ---------- */
function setRatio(v){try{R.setPixelRatio(v);R.setSize(innerWidth,innerHeight)}catch(e){}try{curRatio=v}catch(e){}}
function setShadow(n){try{dl.castShadow=n>0;if(n>0&&dl.shadow.mapSize.x!==n){dl.shadow.mapSize.set(n,n);if(dl.shadow.map){dl.shadow.map.dispose();dl.shadow.map=null}}try{R.shadowMap.needsUpdate=true}catch(e){}}catch(e){}}
function setFog(v){if(!fogOK)return;try{if(v===ORIG.far){S.fog.near=ORIG.near;S.fog.far=ORIG.far;C.far=ORIG.cfar}else{S.fog.far=v;S.fog.near=v/3;C.far=Math.max(ORIG.cfar,v+10)}C.updateProjectionMatrix()}catch(e){}}
function setBright(v){brk.style.opacity=v<0?(-v/100)*.9:0;brl.style.opacity=v>0?(v/100)*.9:0}
function setCh(){const e=$('ch');if(!e)return;e.style.visibility=cfg.chOn?'visible':'hidden';e.style.width=e.style.height=cfg.chSize+'px';e.style.margin=(-cfg.chSize/2)+'px';e.style.borderColor=cfg.chCol}
function setHud(){document.documentElement.style.setProperty('--bo',cfg.bo);document.documentElement.style.setProperty('--bs',cfg.bs);
 ['sc','rs'].forEach(i=>{const e=$(i);if(e)e.style.visibility=cfg.hudScore?'visible':'hidden'});const k=$('kf');if(k)k.style.visibility=cfg.hudMsg?'visible':'hidden'}
function setFov(){try{if(!sc){C.fov=cfg.fov;C.updateProjectionMatrix()}}catch(e){}}
let wl=null;async function setWake(){try{if(cfg.wake&&navigator.wakeLock){if(!wl)wl=await navigator.wakeLock.request('screen');wl.addEventListener&&wl.addEventListener('release',()=>{wl=null})}else if(wl){await wl.release();wl=null}}catch(e){wl=null}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&cfg.wake&&!wl)setWake()});
function applyAll(){
 if(cfg.ratio!==DEF.ratio||R.getPixelRatio()!==cfg.ratio)setRatio(cfg.ratio);
 if(cfg.shadow!==DEF.shadow)setShadow(cfg.shadow);
 if(cfg.fogFar!==DEF.fogFar)setFog(cfg.fogFar);
 setBright(cfg.bright);setCh();setHud();setFov();try{applyFx()}catch(e){}fpsb.style.display=cfg.fps?'block':'none';if(cfg.wake)setWake()}

/* zoom do jogo: ao sair da mira volta para o FOV escolhido */
const oz=window.zoom;
if(typeof oz==='function')window.zoom=function(){const r=oz.apply(this,arguments);try{if(!sc){C.fov=cfg.fov;C.updateProjectionMatrix()}}catch(e){}return r};

/* volume geral: todo som que vai para a saída passa por um ganho */
const gains=[];
try{
 if(window.AudioNode&&window.AudioDestinationNode){
  const oc=AudioNode.prototype.connect,mm=new WeakMap();
  const master=ctx=>{let m=mm.get(ctx);if(!m){m=ctx.createGain();oc.call(m,ctx.destination);mm.set(ctx,m);gains.push(m)}m.gain.value=cfg.vol/100;return m};
  AudioNode.prototype.connect=function(d){try{if(d instanceof AudioDestinationNode){const m=master(d.context);if(this!==m)return oc.apply(this,[m].concat(Array.prototype.slice.call(arguments,1)))}}catch(e){}return oc.apply(this,arguments)}}
}catch(e){}
const setVol=()=>gains.forEach(g=>{try{g.gain.value=cfg.vol/100}catch(e){}});

/* ---------- sensibilidade (soma ao que o jogo já faz) ---------- */
document.addEventListener('touchmove',e=>{
 try{if(!started||typeof lid==='undefined'||lid==null)return;
  for(const t of e.changedTouches){if(t.identifier!==lid)continue;
   const k=sc?.0018:.0055,m=sc?cfg.sensA:cfg.sensT,dx=t.clientX-lp[0],dy=t.clientY-lp[1];
   P.yaw-=dx*k*(m-1);P.pt=cl(P.pt-dy*k*(m*cfg.sensV*(cfg.inv?-1:1)-1),-1.4,1.4)}}catch(_){}},{capture:true,passive:true});
document.addEventListener('touchmove',e=>{
 try{if(!started||typeof mid==='undefined'||mid==null||cfg.stick===1)return;
  for(const t of e.changedTouches){if(t.identifier!==mid)continue;
   const r=45/cfg.stick;jx=cl((t.clientX-mo[0])/r,-1,1);jy=cl(-(t.clientY-mo[1])/r,-1,1)}}catch(_){}},{passive:true});
let gt2=performance.now();
addEventListener('devicemotion',e=>{
 try{const r=e.rotationRate,n=performance.now(),dt=Math.min((n-gt2)/1000,.05);gt2=n;
  if(!started||typeof gy==='undefined'||!gy||!r||P.hp<=0||cfg.sensG===1)return;
  const a=(screen.orientation&&screen.orientation.angle)||90,s=a==270?-1:1,k=Math.PI/180*(sc?.35:1.2)*dt*s*(cfg.sensG-1);
  P.yaw+=(r.beta||0)*k;P.pt=cl(P.pt+(r.gamma||0)*k*(cfg.inv?-1:1),-1.4,1.4)}catch(_){}});

/* ---------- DESEMPENHO: limite de FPS, estabilizador, corte de bonecos fora da tela, sombras econômicas ---------- */
const pr=R.render;let lastCall=performance.now(),acc=0,fN=0,fT=performance.now(),lastAm=-1,frame=0;
const FR_=new THREE.Frustum(),PM_=new THREE.Matrix4(),IV_=new THREE.Matrix4(),SP_=new THREE.Sphere();
let wN=0,wT=performance.now(),good=0,bad=0,stage=0,fxOff=0,hitchT=0,wasOff=1,ceilR=9,lastDeg=0,curRatio=R.getPixelRatio(),lastFps=0;
function applyFx(){try{if(typeof LK==='undefined'||typeof li==='undefined')return;const f=LK[li]&&LK[li].fl;R.domElement.style.filter=(cfg.colorFx&&!fxOff&&f)?f:'none'}catch(e){}}
const olk=window.look;if(typeof olk==='function')window.look=function(){const r=olk.apply(this,arguments);applyFx();return r};
function setCur(v){curRatio=v;try{R.setPixelRatio(v);R.setSize(innerWidth,innerHeight)}catch(e){}}
/* bonecos fora do campo de visão não são desenhados (nem na sombra); os longe não fazem sombra */
function cull(){
 try{C.updateMatrixWorld(true);IV_.copy(C.matrixWorld).invert();PM_.multiplyMatrices(C.projectionMatrix,IV_);FR_.setFromProjectionMatrix(PM_);
  for(const b of bots){const n=b.nm22,m=b.mesh;if(!n||!n.sm||!m)continue;
   SP_.center.set(m.position.x,m.position.y+.9,m.position.z);SP_.radius=b.hp>0?1.6:4.5;
   const d=C.position.distanceTo(SP_.center),vis=d<9||FR_.intersectsSphere(SP_);
   if(n.sm.visible!==vis)n.sm.visible=vis;
   const cs=vis&&d<45;if(n.sm.castShadow!==cs)n.sm.castShadow=cs}}catch(e){}}
function showAllBots(){try{for(const b of bots){const n=b.nm22;if(n&&n.sm){n.sm.visible=true;n.sm.castShadow=true}}}catch(e){}}
/* estabilizador: mede o FPS a cada segundo e ajusta a resolução (e, se precisar, filtro/sombra) */
function tune(fps){
 lastFps=fps;
 if(!cfg.autoRes)return;
 const target=cfg.fpsLimit||60,mx=cfg.ratio,mn=Math.min(mx,.55);
 if(fps<target*.9){good=0;bad++;
  if(curRatio>mn+.01){ceilR=Math.min(ceilR,curRatio*.97);lastDeg=performance.now();setCur(Math.max(mn,+(curRatio*.88).toFixed(2)));bad=0}
  else if(bad>=3){bad=0;
   if(stage===0&&cfg.colorFx){stage=1;fxOff=1;applyFx()}
   else if(stage<=1&&dl.castShadow&&dl.shadow.mapSize.x>1024){stage=2;setShadow(1024)}
   else if(stage<=2&&dl.castShadow){stage=3;setShadow(0)}}}
 else if(fps>=target*.96){bad=0;
  if(performance.now()-lastDeg>45000&&ceilR<mx){ceilR*=1.06;lastDeg=performance.now()}
  if(curRatio<Math.min(mx,ceilR)-.01){good++;if(good>=3){good=0;setCur(Math.min(mx,ceilR,+(curRatio*1.08).toFixed(2)))}}else good=0}
 else{good=0;bad=0}}
R.render=function(){
 const n=performance.now(),dt=n-lastCall;lastCall=n;
 if(dt>300)hitchT=n;
 /* no lobby a cena do jogo não precisa ser desenhada (o lobby tem a própria) */
 if(!started&&!paused){wasOff=1;return}
 if(wasOff){wasOff=0;wN=0;wT=n;hitchT=n;acc=0;good=0;bad=0}
 if(cfg.fpsLimit){const iv=1000/cfg.fpsLimit;acc=Math.min(acc+dt,iv*2);if(acc<iv-2)return;acc-=iv;if(acc>iv)acc=0}else acc=0;

<script>
/* ===== CAMPO DE TREINO =====

 g.fillStyle=col;g.font='bold 34px sans-serif';g.textAlign='center';g.textBaseline='middle';g.fillText(txt,64,33);
 const s=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),fog:false,transparent:true,depthWrite:false}));s.scale.set(sx,sy,1);return s};
const flat=(w,d,col,op,x,z)=>{const m=new THREE.Mesh(new THREE.PlaneGeometry(w,d),new THREE.MeshBasicMaterial({color:col,transparent:true,opacity:op,depthWrite:false}));
 m.rotation.x=-Math.PI/2;m.position.set(x,.035,z);TG.add(m);return m};
flat(2.8,2.8,0x2fe0a0,.35,START.x,START.z+.2);                       /* ponto de partida */
for(let d=10;d<=80;d+=10){const z=START.z-d;flat(2.8,.14,0xffffff,.55,LANE_X,z);
 const s=label(d+' m','#ffffff',1.1+d*.028,.55+d*.014);s.position.set(WALL_X-.2,1.5,z);TG.add(s)}

 bots.forEach(b=>{try{S.remove(b.mesh)}catch(e){}});bots.length=0;
 dm.forEach(b=>{if(b._lab)TG.remove(b._lab)});dm=[];

 });
 ents.length=0;ents.push(P,...bots)}
function revive(b){

let lt=performance.now();
function tick(){

   O jogo desliga o toque da tela inteira (touch-action:none), então o dedo não rolava as listas.
   Aqui o dedo arrastado dentro de ⚙ e do lobby rola a lista (com inércia). Sliders continuam normais. */
(function(){

const zone=t=>t&&t.closest&&t.closest('#cfg,#ov,#md');
const scr=t=>{for(let e=t;e&&e!==document.body&&e.nodeType===1;e=e.parentElement){

 const dtm=Math.max(1,n-lt);vy=vy*.6+((el.scrollTop-prev)/dtm)*.4;lt=n},{passive:false,capture:true});

 const step=()=>{if(Math.abs(v)<.4)return;E.scrollTop+=v;v*=.95;raf=requestAnimationFrame(step)};
 if(performance.now()-lt<80)raf=requestAnimationFrame(step)};
